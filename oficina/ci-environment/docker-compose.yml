services:
    jenkins:
      build:
        context: .
        dockerfile: Dockerfile
      image: jenkins/pos:latest
      container_name: jenkins_server
      restart: unless-stopped
      environment:
        SONAR_TOKEN: "sqp_2d49e6798f04c15cc18cf43ea2194dd51f900827"
      ports:
        - "8080:8080"
        - "50000:50000"
      volumes:
        - jenkins_data:/var/jenkins_home
      networks:
        - ci_network
      depends_on:
        - sonarqube

    sonarqube:
      image: sonarqube:lts-community
      container_name: sonarqube_server
      restart: unless-stopped
      ports:
        - "9000:9000"
      environment:
        - SONAR_JDBC_USERNAME=sonar
        - SONAR_JDBC_PASSWORD=sonarpass
        - SONAR_JDBC_URL=jdbc:postgresql://sonar_db:5432/sonar
      volumes:
        - sonarqube_data:/opt/sonarqube/data
        - sonarqube_extensions:/opt/sonarqube/extensions
        - sonarqube_logs:/opt/sonarqube/logs
      networks:
        - ci_network
      depends_on:
        - sonar_db
      ulimits:
        nofile:
          soft: 65536
          hard: 65536

    sonar_db:
      image: postgres:15-alpine
      container_name: sonar_database
      restart: unless-stopped
      environment:
        - POSTGRES_USER=sonar
        - POSTGRES_PASSWORD=sonarpass
        - POSTGRES_DB=sonar
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - ci_network

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:

networks:
  ci_network:
    driver: bridge