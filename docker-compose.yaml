networks:
  net_ci_cd:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgresql_data:
  postgresql_valkey:
  oficina-db-data:

services:
  # ==========================================
  # JENKINS
  # ==========================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Permite rodar Docker dentro do Jenkins (opcional, mas recomendado)
    networks:
      - net_ci_cd

  # ==========================================
  # SONARQUBE DATABASE (PostgreSQL)
  # ==========================================
  oficina:
    image: postgres:17-alpine
    container_name: oficina
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    networks:
      - net_ci_cd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # SONARQUBE
  # ==========================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      oficina:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=oficina
      - SONAR_JDBC_PASSWORD=oficina
      - SONAR_JDBC_URL=jdbc:postgresql://oficina:5432/oficina
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net_ci_cd
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
