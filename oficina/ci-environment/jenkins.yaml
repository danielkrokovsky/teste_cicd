jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "adminpassword"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  systemMessage: "Jenkins configurado automaticamente via JCasC com integração SonarQube, JDK 21 e Maven."

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token-java"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token-java"
              secret: "${SONAR_TOKEN}"
              description: "Token para análise no SonarQube"

tool:
  jdk:
    installations:
      - name: "JDK-21"
        home: "/usr/lib/jvm/java-21-openjdk-amd64"
  maven:
    installations:
      - name: "maven"
        home: "/usr/share/maven"

jobs:
  - script: >
      pipelineJob('spring-boot-app') {
        definition {
          cps {
            sandbox()
            script('''
              pipeline {
                  agent any
                  tools {
                      jdk 'JDK-21'
                      maven 'maven'
                  }

                  environment {
                      // Nome da instalação do Sonar declarada no jenkins.yaml
                      SONAR_SERVER = 'SonarQube'
                  }

                  stages {
                      stage('Baixar projeto') {
                          steps {
                              echo 'Baixando projeto da branch main'
                              deleteDir()
                              checkout([
                                  $class: 'GitSCM',
                                  branches: [[name: '*/main']],
                                  userRemoteConfigs: [[url: 'https://github.com/danielkrokovsky/teste_cicd.git']]
                              ])
                              sh 'git rev-parse --show-toplevel && git log -1 --oneline'
                          }
                      }

                      stage('Compilação e Testes') {
                          steps {
                              echo 'Rodando a partir do arquivo Jenkinsfile'
                              echo 'Compilando Spring Boot e executando testes com JaCoCo...'
                              sh 'mvn -f oficina/pom.xml install jacoco:report'
                          }
                          post {
                              always {
                                  // Publica relatório de testes unitários
                                  junit testResults: '**/target/surefire-reports/*.xml', allowEmptyResults: true

                                  // Publica cobertura do JaCoCo no Jenkins
                                  jacoco(
                                      execPattern: '**/target/*.exec',
                                      classPattern: '**/target/classes',
                                      sourcePattern: '**/src/main/java'
                                  )
                              }
                          }
                      }

                      stage('Análise SonarQube') {
                          steps {
                              echo 'Enviando métricas para o SonarQube...'
                              withSonarQubeEnv('SonarQube') {
                                  withCredentials([string(credentialsId: 'sonar-token-java', variable: 'SONAR_TOKEN')]) {
                                      sh 'mvn -f oficina/pom.xml clean verify sonar:sonar ' +
                                          '-Dsonar.host.url=http://sonarqube:9000 ' +
                                          '-Dsonar.projectKey=spring-boot-app ' +
                                          '-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml'
                                  }
                              }
                          }
                      }
                      stage('Gerar JAR Spring Boot') {
                          steps {
                              sh 'mvn -f oficina/pom.xml package -DskipTests'
                              archiveArtifacts artifacts: '**/target/*.jar', allowEmptyArchive: false
                          }
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }
  - script: >
      pipelineJob('teste_cicd-github') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/danielkrokovsky/teste_cicd.git')
                }
                branch('*/main')
              }
            }
            scriptPath('oficina/Jenkinsfile')
            lightweight()
          }
        }
      }