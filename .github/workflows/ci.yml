name: CI Spring Boot Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para análises de código precisas (ex: SonarQube)

      # 2. Configuração do Java (JDK 17 ou 21, conforme seu projeto)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build e Testes com Maven
      - name: Build and Test with Maven
        run: mvn clean verify

      # 4. Análise de Código Estático (Exemplo com SonarQube)
      # Nota: É preciso configurar SONAR_TOKEN e SONAR_HOST_URL nos Secrets do repositório
#      - name: SonarQube Scan
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#        run: mvn sonar:sonar -Dsonar.projectName="Meu Projeto Spring Boot"

      # 5. Análise de Vulnerabilidades em Dependências (OWASP Dependency-Check)
      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check

      # 6. Upload do Relatório de Vulnerabilidades (Opcional, para consulta)
      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html