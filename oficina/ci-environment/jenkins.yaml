jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "adminpassword"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  systemMessage: "Jenkins configurado automaticamente via JCasC com integração SonarQube, JDK 21 e Maven."

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"

tool:
  jdk:
    installations:
      - name: "JDK-21"
        home: "/usr/lib/jvm/java-21-openjdk-amd64"
  maven:
    installations:
      - name: "maven"
        home: "/usr/share/maven"

jobs:
  - script: >
      pipelineJob('spring-boot-app') {
        definition {
          cps {
            sandbox()
            script('''
              pipeline {
                  agent any
                  tools {
                      jdk 'JDK-21'
                      maven 'maven'
                  }
                  options {
                      buildDiscarder(logRotator(numToKeepStr: '5'))
                      timeout(time: 1, unit: 'HOURS')
                  }
                  stages {
                      
                      stage('Checkout') {
                          steps {
                              echo 'Rodando a partir do arquivo Jenkins.yaml'
                              // Se for usar Git, descomente e substitua pela sua URL/branch:
                              // git branch: 'main', url: 'https://github.com/usuario/spring-boot-demo.git'
                              echo 'Código clonado com sucesso.'
                          }
                      }
                      stage('Build & Testes com JaCoCo') {
                          steps {
                              sh 'mvn -f oficina/pom.xml clean verify jacoco:report'
                          }
                          post {
                              always {
                                  junit testResults: '**/target/surefire-reports/*.xml', allowEmptyResults: true
                                  jacoco(
                                      execPattern: '**/target/*.exec',
                                      classPattern: '**/target/classes',
                                      sourcePattern: '**/src/main/java'
                                  )
                              }
                          }
                      }
                      stage('SonarQube Analysis') {
                          steps {
                              echo 'Enviando métricas para o SonarQube...'
                              withSonarQubeEnv(env.SONAR_SERVER) {
                                  withCredentials([string(credentialsId: 'sonar-token-java', variable: 'SONAR_TOKEN')]) {
                                      sh '''
                                          mvn -f oficina/pom.xml \
                                              org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
                                             -Dsonar.projectKey=spring-boot-app \
                                             -Dsonar.token=${SONAR_TOKEN} \
                                             -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
                                      '''
                                  }
                              }
                          }
                      }
                      stage('Empacotamento Spring Boot') {
                          steps {
                              sh 'mvn -f oficina/pom.xml package -DskipTests'
                              archiveArtifacts artifacts: '**/target/*.jar', fingerprint: true
                          }
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }